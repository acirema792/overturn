<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 560" width="1120" height="560" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">Overturn architecture</title>
  <desc id="d">The letter is read and de-identified on the device; a code gate checks the outgoing text; only de-identified text reaches Gemini in the cloud; the real details are put back on the device.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3b4a45"/>
    </marker>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2457a6"/>
    </marker>
  </defs>
  <rect width="1120" height="560" rx="16" fill="#fbfaf7"/>

  <!-- Zones -->
  <rect x="20" y="20" width="700" height="460" rx="14" fill="#e6f2ec" stroke="#1f7a4d" stroke-width="1.5"/>
  <text x="40" y="50" font-size="17" font-weight="700" fill="#14513a">YOUR DEVICE · Chrome</text>
  <text x="40" y="70" font-size="12.5" fill="#2f5d4a">The raw letter, the names and the finished letter never leave this box</text>

  <rect x="760" y="20" width="340" height="460" rx="14" fill="#e3ecfa" stroke="#2457a6" stroke-width="1.5"/>
  <text x="780" y="50" font-size="17" font-weight="700" fill="#1d4486">CLOUD · Firebase AI Logic</text>
  <text x="780" y="70" font-size="12.5" fill="#2d4f86">Sees only placeholders like [PERSON_1]</text>

  <!-- Device row 1 -->
  <g font-size="13" fill="#1b2421">
    <rect x="40" y="95" width="150" height="86" rx="10" fill="#fff" stroke="#9db8ab"/>
    <text x="115" y="122" text-anchor="middle" font-weight="700">Denial letter</text>
    <text x="115" y="142" text-anchor="middle">paste · PDF · photo</text>
    <text x="115" y="161" text-anchor="middle" font-size="11.5" fill="#55625d">PDF read by pdf.js</text>

    <rect x="225" y="95" width="210" height="86" rx="10" fill="#fff" stroke="#1f7a4d" stroke-width="2"/>
    <text x="330" y="120" text-anchor="middle" font-weight="700">Gemini Nano</text>
    <text x="330" y="139" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11.5" fill="#14513a">ONLY_ON_DEVICE</text>
    <text x="330" y="158" text-anchor="middle" font-size="12">finds names, IDs, addresses;</text>
    <text x="330" y="173" text-anchor="middle" font-size="12">reads the denial reason</text>

    <rect x="470" y="95" width="230" height="86" rx="10" fill="#fff" stroke="#9db8ab"/>
    <text x="585" y="120" text-anchor="middle" font-weight="700">Code: hide and decide</text>
    <text x="585" y="140" text-anchor="middle" font-size="12">14 identifier kinds + vault</text>
    <text x="585" y="156" text-anchor="middle" font-size="12">deadline rules (ERISA, ACA,</text>
    <text x="585" y="171" text-anchor="middle" font-size="12">Medicare Advantage, Medicaid)</text>
  </g>
  <line x1="190" y1="138" x2="222" y2="138" stroke="#3b4a45" stroke-width="2" marker-end="url(#a)"/>
  <line x1="435" y1="138" x2="467" y2="138" stroke="#3b4a45" stroke-width="2" marker-end="url(#a)"/>

  <!-- Device row 2 -->
  <g font-size="13" fill="#1b2421">
    <rect x="470" y="225" width="230" height="86" rx="10" fill="#fff" stroke="#9db8ab"/>
    <text x="585" y="252" text-anchor="middle" font-weight="700">You review</text>
    <text x="585" y="272" text-anchor="middle" font-size="12">your letter vs. what will leave;</text>
    <text x="585" y="288" text-anchor="middle" font-size="12">hide anything else with a click</text>

    <rect x="225" y="225" width="210" height="86" rx="10" fill="#fff4e0" stroke="#b46a00" stroke-width="2"/>
    <text x="330" y="252" text-anchor="middle" font-weight="700">Egress gate (code)</text>
    <text x="330" y="272" text-anchor="middle" font-size="12">blocks the request if any</text>
    <text x="330" y="288" text-anchor="middle" font-size="12">identifier is still in it</text>
  </g>
  <line x1="585" y1="181" x2="585" y2="222" stroke="#3b4a45" stroke-width="2" marker-end="url(#a)"/>
  <line x1="470" y1="268" x2="438" y2="268" stroke="#3b4a45" stroke-width="2" marker-end="url(#a)"/>

  <!-- Offline branch -->
  <g font-size="12" fill="#1b2421">
    <rect x="40" y="225" width="150" height="86" rx="10" fill="#fff" stroke="#9db8ab" stroke-dasharray="5 4"/>
    <text x="115" y="250" text-anchor="middle" font-weight="700" font-size="13">Offline?</text>
    <text x="115" y="269" text-anchor="middle">Nano drafts on device,</text>
    <text x="115" y="285" text-anchor="middle">or a template letter</text>
    <text x="115" y="301" text-anchor="middle" fill="#55625d">(no AI)</text>
  </g>
  <line x1="225" y1="268" x2="193" y2="268" stroke="#3b4a45" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>

  <!-- Cloud -->
  <g font-size="13" fill="#1b2421">
    <rect x="790" y="210" width="290" height="116" rx="10" fill="#fff" stroke="#2457a6" stroke-width="2"/>
    <text x="935" y="237" text-anchor="middle" font-weight="700">Gemini (cloud)</text>
    <text x="935" y="256" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11.5" fill="#1d4486">PREFER_IN_CLOUD</text>
    <text x="935" y="277" text-anchor="middle" font-size="12">explanation, arguments, evidence,</text>
    <text x="935" y="293" text-anchor="middle" font-size="12">questions for your doctor,</text>
    <text x="935" y="309" text-anchor="middle" font-size="12">appeal letter with placeholders</text>

    <rect x="790" y="95" width="290" height="86" rx="10" fill="#fff" stroke="#9fb4d8"/>
    <text x="935" y="122" text-anchor="middle" font-weight="700">App Check · Remote Config</text>
    <text x="935" y="142" text-anchor="middle" font-size="12">reCAPTCHA Enterprise;</text>
    <text x="935" y="158" text-anchor="middle" font-size="12">model, letter length, thinking level</text>
  </g>
  <line x1="935" y1="181" x2="935" y2="207" stroke="#2457a6" stroke-width="1.5" marker-end="url(#ac)"/>

  <!-- Crossing: de-identified text out -->
  <path d="M330,311 V338 H770 V300 H784" fill="none" stroke="#2457a6" stroke-width="2.5" stroke-linejoin="round" marker-end="url(#ac)"/>
  <text x="540" y="331" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d4486">de-identified text only, after the gate passes</text>

  <!-- Back to device -->
  <g font-size="13" fill="#1b2421">
    <rect x="225" y="365" width="475" height="86" rx="10" fill="#fff" stroke="#1f7a4d" stroke-width="2"/>
    <text x="462" y="392" text-anchor="middle" font-weight="700">Details put back on the device</text>
    <text x="462" y="412" text-anchor="middle" font-size="12">[PERSON_1] → the real name, from the vault that never left</text>
    <text x="462" y="429" text-anchor="middle" font-size="12">edit · print · add the deadline to your calendar (.ics)</text>
  </g>
  <path d="M935,326 C935,410 800,408 703,408" fill="none" stroke="#2457a6" stroke-width="2.5" marker-end="url(#ac)"/>
  <line x1="115" y1="311" x2="115" y2="400" stroke="#3b4a45" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="115" y1="400" x2="222" y2="400" stroke="#3b4a45" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#a)"/>

  <!-- Ledger -->
  <rect x="20" y="496" width="1080" height="46" rx="10" fill="#f0eee8" stroke="#cfc9bb"/>
  <text x="40" y="524" font-size="13" fill="#1b2421"><tspan font-weight="700">Privacy ledger</tspan> on every screen: where each step ran (from the SDK's inferenceSource), prompt bytes sent, and the Gemini requests your browser recorded.</text>
</svg>
