name: Test and evaluate

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run eval
      # The site itself is published to the gh-pages branch by scripts/deploy-pages.sh.
      - name: Build
        run: npm run build
      - name: UI smoke test (simulated engine)
        run: |
          npx playwright install --with-deps chromium
          npm run e2e
